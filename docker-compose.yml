services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfashion}
      POSTGRES_USER: ${POSTGRES_USER:-smartfashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfashion_dev}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfashion}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
  ai:
    build: ./apps/ai
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartfashion}:${POSTGRES_PASSWORD:-smartfashion_dev}@postgres:5432/${POSTGRES_DB:-smartfashion}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartfashion}:${POSTGRES_PASSWORD:-smartfashion_dev}@postgres:5432/${POSTGRES_DB:-smartfashion}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8001
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change}
      DECART_API_KEY: ${DECART_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      ai: {condition: service_started}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
